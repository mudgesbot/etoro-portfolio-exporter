<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #e7f3ff; color: #0c5460; }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .primary { background: #00c853; color: white; }
    .primary:hover:not(:disabled) { background: #00a844; }
    .secondary { background: #f0f0f0; color: #333; }
    .secondary:hover:not(:disabled) { background: #e0e0e0; }
    .export-row {
      display: flex;
      gap: 8px;
    }
    .export-row button { flex: 1; }
    .preview {
      margin-top: 12px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .preview pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .divider {
      border-top: 1px solid #eee;
      margin: 8px 0;
      padding-top: 8px;
    }
    .section-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>📊 eToro Exporter</h1>
  
  <div id="status" class="status info">
    Click "Scrape Portfolio" to extract your positions.
  </div>
  
  <div class="buttons">
    <button id="scrape" class="primary">🔍 Scrape Portfolio</button>
    
    <div class="divider">
      <div class="section-label">Export Options</div>
    </div>
    
    <div class="export-row">
      <button id="downloadExcel" class="secondary" disabled>📗 Excel (CSV)</button>
      <button id="downloadJson" class="secondary" disabled>📄 JSON</button>
    </div>
    
    <div class="export-row">
      <button id="copyJson" class="secondary" disabled>📋 Copy JSON</button>
      <button id="copyTable" class="secondary" disabled>📋 Copy Table</button>
    </div>
  </div>
  
  <div id="preview" class="preview" style="display: none;">
    <pre id="previewText"></pre>
  </div>
  
  <div class="footer">
    <div>Tip: scroll your portfolio to load all positions before scraping.</div>
    <a href="https://www.etoro.com/portfolio" target="_blank" rel="noopener noreferrer">Open eToro Portfolio</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
